<text x="44" y="636.5" font-size="12" fill="#232F3E" text-anchor="start" font-weight="normal">G0 = 예 → 모드 ① 실시간 복제 + M4·M5·M6 진행   |   G0 = 아니오 → 모드 ② 백업(M2 의 백업 시점 테스트 결과로 주기 결정) 또는 모드 ③ 복제 불필요 → M4·M5·M6 보류</text>
