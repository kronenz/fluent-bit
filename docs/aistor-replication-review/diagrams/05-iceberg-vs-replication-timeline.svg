<text x="44" y="38.333333333333336" font-size="22" fill="#000000" text-anchor="start" font-weight="bold">Iceberg 스냅샷 커밋 vs AIStor Bucket Replication — 충돌 지점 (시간 순)</text>
<text x="44" y="62.0" font-size="12" fill="#5E6C84" text-anchor="start" font-weight="normal">S3 복제는 '객체(버전) 단위 비동기'이고 Iceberg 커밋은 '카탈로그 포인터 원자 교체' — 두 단위가 맞지 않아 C1~C4 충돌이 발생</text>
