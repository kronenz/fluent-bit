<rect x="40" y="665" width="1420" height="105" rx="6" fill="#FFF1F0" stroke="#DD344C"/>
<text x="44" y="713.8333333333334" font-size="13" fill="#DD344C" text-anchor="start" font-weight="bold">협의 필요 — 결정 기준: ① 아카이브 데이터 조회 요구(빈도 · 방식)  ② 소형 객체 수 · Scanner 부하  ③ 압축 이득(용량)  ④ 서비스 구현 · 운영 부담  ⑤ 보존 · 삭제 정책</text>
<text x="44" y="729.8333333333334" font-size="13" fill="#DD344C" text-anchor="start" font-weight="bold">권고 순서: A 로 시작 가능한지 확인 → 객체 수·용량 문제가 확인되면 B(하이브리드) → C 는 B 로 해결되지 않는 요구가 있을 때만</text>
<text x="44" y="38.333333333333336" font-size="22" fill="#000000" text-anchor="start" font-weight="bold">RAW 아카이브 방식 선택지 — A. zip 미사용 · B. 하이브리드 · C. 전면 Rollover (협의 필요)</text>
<text x="44" y="62.0" font-size="12" fill="#5E6C84" text-anchor="start" font-weight="normal">ILM 은 Transition · Expiration 만 제공 (zip 생성 불가) · 하이브리드는 '변환은 서비스, 이관은 ILM' 으로 역할 분리</text>
