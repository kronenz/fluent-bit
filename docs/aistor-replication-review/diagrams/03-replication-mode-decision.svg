<text x="760.0" y="152.33333333333334" font-size="13" fill="#232F3E" text-anchor="middle" font-weight="bold">데이터 백업(DR) 인가?</text>
<rect x="40" y="250" width="440" height="110" rx="6" fill="#E6F7F4" stroke="#01A88D"/>
<text x="260.0" y="286.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">모드 ① 조회용 실시간 Replication</text>
<text x="260.0" y="301.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">· 복제 → 검증 → HMS-Warm register</text>
<text x="260.0" y="316.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">· 충돌 C1~C5 대응 · Scanner 지연 관리 필수</text>
<text x="260.0" y="331.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">· 용인 Warm 단독 조회 구성 (장표 2)</text>
<rect x="540" y="250" width="440" height="110" rx="6" fill="#FFF4E5" stroke="#ED7100"/>
<text x="760.0" y="286.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">모드 ② 백업용 Replication</text>
<text x="760.0" y="301.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">· 실시간 아님 — 테이블 특성별 백업 시점</text>
<text x="760.0" y="316.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">· 유지보수(merge·스냅샷 정리) 후 복제</text>
<text x="760.0" y="331.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">· 복구 시에만 Warm register</text>
<rect x="1040" y="100" width="420" height="80" rx="6" fill="#F4F5F7" stroke="#7D8998"/>
<text x="1250.0" y="136.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="bold">모드 ③ Replication 불필요</text>
<text x="1250.0" y="151.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="bold">→ ILM Transition 만 사용 (Hot 용량 관리)</text>
<rect x="1040" y="250" width="420" height="110" rx="6" fill="#FFF1F0" stroke="#DD344C"/>
<text x="1250.0" y="286.5" font-size="12" fill="#DD344C" text-anchor="middle" font-weight="normal">먼저 확인: 담당자 우려사항</text>
<text x="1250.0" y="301.5" font-size="12" fill="#DD344C" text-anchor="middle" font-weight="normal">· 조회 케이스 유무 · RPO/RTO</text>
<text x="1250.0" y="316.5" font-size="12" fill="#DD344C" text-anchor="middle" font-weight="normal">· 복제 용량·대역폭 · 운영 부담</text>
<text x="1250.0" y="331.5" font-size="12" fill="#DD344C" text-anchor="middle" font-weight="normal">→ 03-future/00-owner-concerns</text>
