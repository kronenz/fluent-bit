<text x="260.0" y="136.33333333333334" font-size="13" fill="#232F3E" text-anchor="middle" font-weight="bold">Q1. Warm MinIO 의 데이터를 HMS(Trino · Polaris)로</text>
<text x="260.0" y="152.33333333333334" font-size="13" fill="#232F3E" text-anchor="middle" font-weight="bold">직접 조회하는 케이스가 있는가?</text>
