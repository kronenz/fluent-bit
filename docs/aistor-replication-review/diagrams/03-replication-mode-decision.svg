<text x="925.0" y="656.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">→ 전체 스냅샷 주기 복사 (가설)</text>
<rect x="1110" y="610" width="330" height="70" rx="6" fill="#F5F0FF" stroke="#8C4FFF"/>
<text x="1275.0" y="641.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">대형 이력 파티션</text>
<text x="1275.0" y="656.5" font-size="12" fill="#232F3E" text-anchor="middle" font-weight="normal">→ 마감 파티션만 1회 복제 (가설)</text>
<rect x="60" y="710" width="1380" height="80" rx="6" fill="#FAFBFC" stroke="#5E6C84"/>
<text x="64" y="746.5" font-size="12" fill="#232F3E" text-anchor="start" font-weight="normal">검증 포인트: 유지보수 후 복제 시 복제 객체 수·용량 감소량 · 삭제(delete marker) 전파 방식 · 복제 규칙 disable→enable 시 누락분 처리 · 배치 복제 기능 지원 여부 🔍</text>
<text x="64" y="761.5" font-size="12" fill="#232F3E" text-anchor="start" font-weight="normal">Iceberg 순서 보장: data → manifest → metadata.json 순으로 복사하면 백업 시점 스냅샷 일관성 확보 가능 (rewrite_table_path 방식과 비교)</text>
<text x="44" y="38.333333333333336" font-size="22" fill="#000000" text-anchor="start" font-weight="bold">Replication 필요성 판단 — 조회용 실시간 복제 vs 백업용 복제 vs 불필요</text>
<text x="44" y="62.0" font-size="12" fill="#5E6C84" text-anchor="start" font-weight="normal">Warm 데이터를 HMS 로 조회하는 케이스가 없으면 실시간 Replication 은 필요 없음 · 백업 용도면 테이블 특성별 백업 시점을 테스트로 결정</text>
