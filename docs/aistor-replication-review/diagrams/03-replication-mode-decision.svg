<text x="74" y="427.3333333333333" font-size="13" fill="#232F3E" text-anchor="start" font-weight="normal">모드 ② 백업 시점 테스트 — 테이블 특성별 (merge · 스냅샷 정리 후 복제 가능 여부)</text>
