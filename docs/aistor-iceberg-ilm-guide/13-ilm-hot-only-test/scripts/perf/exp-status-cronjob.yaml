# 기한 삭제 시험(E-*) 실시간 추적 — 매시 45분 버킷 상태를 <EVIDENCE_DIR>/ilmtest.expobj.jsonl 에 남긴다.
# 확인점: mc stat 의 Expiration 시각(예: age-4.5) · delete marker 생성 + 비현행 1일(→ 다음 00:00 UTC).
# __EV__ · __VB__ · __NB__ · __PREFIXES__ 는 run-expiry.sh 가 채운다.
# 스크립트는 ConfigMap ilmtest-exp (perf/exp-object-test.sh · perf/s3_backdate.py).
# ⚠️ WARM 관리자 계정으로 목록을 보므로 Warm audit 에 관리자 accessKey 가 매시 남는다 (J-7 판정에서 제외).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ilmtest-exp-status
  labels: { app.kubernetes.io/part-of: ilmtest, app.kubernetes.io/name: exp-status }
spec:
  schedule: "45 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: { app.kubernetes.io/part-of: ilmtest, app.kubernetes.io/name: exp-status }
        spec:
          restartPolicy: Never
          securityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: status
              image: python:3.12-slim
              command: ["/bin/bash", "-c", "cp /exp/* /tmp/ && cd /tmp && bash exp-object-test.sh status hourly >/dev/null"]
              env:
                - { name: PATH, value: "/shared/bin:/usr/local/bin:/usr/bin:/bin" }
                - { name: HOME, value: /tmp }
                - { name: MC_CONFIG_DIR, value: /tmp/.mc }
                - { name: EVIDENCE_DIR, value: "__EV__" }
                - { name: VB, value: "__VB__" }
                - { name: NB, value: "__NB__" }
                - { name: EXP_ICEBERG_PREFIXES, value: "__PREFIXES__" }
                - { name: PYTHONWARNINGS, value: ignore }
              envFrom: [{ secretRef: { name: ilmtest-admin } }]
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
              resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
              volumeMounts: [{ name: exp, mountPath: /exp }, { name: shared, mountPath: /shared }]
          volumes:
            - { name: exp, configMap: { name: ilmtest-exp } }
            - { name: shared, persistentVolumeClaim: { claimName: ilmtest-shared } }
