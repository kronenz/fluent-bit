# MinIO hot / warm — 서로 다른 배포(remote tier 는 같은 배포의 다른 버킷으로는 안 된다).
# 바이너리는 공유 볼륨(/shared/bin/minio, 00-shared.yaml)에서 실행한다.
# audit 로그는 환경변수로 Fluent Bit 수신기(fluent-bit-audit:8888/<tag>)에 보낸다.
# ★ 수신기를 MinIO 보다 먼저 띄울 것 — 수신기가 없을 때 보낸 감사 로그는 버려진다.
#   queue_dir(디스크 큐)을 켜면 재전송은 되지만 여러 건을 한 요청에 묶어 보내
#   Fluent Bit http input 이 "invalid JSON message" 로 전부 버린다 (2026-10-25 실측).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio-hot
  labels: { app.kubernetes.io/part-of: ilmtest, app.kubernetes.io/name: minio-hot }
spec:
  serviceName: minio-hot
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: minio-hot } }
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: ilmtest, app.kubernetes.io/name: minio-hot }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: minio
          image: debian:12-slim
          command: ["/shared/bin/minio", "server", "/data", "--address", ":9000", "--console-address", ":9001"]
          envFrom: [{ secretRef: { name: ilmtest-minio-hot } }]     # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
          env:
            - { name: MINIO_PROMETHEUS_AUTH_TYPE, value: public }
            - { name: MINIO_AUDIT_WEBHOOK_ENABLE_ilmtest, value: "on" }
            - { name: MINIO_AUDIT_WEBHOOK_ENDPOINT_ilmtest, value: "http://fluent-bit-audit.ilm-test.svc:8888/minio-hot" }
            - { name: HOME, value: /tmp }
          ports: [{ name: s3, containerPort: 9000 }, { name: console, containerPort: 9001 }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: 9000 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { memory: 2Gi } }
          volumeMounts: [{ name: data, mountPath: /data }, { name: shared, mountPath: /shared, readOnly: true }]
      volumes: [{ name: shared, persistentVolumeClaim: { claimName: ilmtest-shared } }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: csi-cinder-sc-delete
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: minio-hot
  labels: { app.kubernetes.io/part-of: ilmtest }
spec:
  selector: { app.kubernetes.io/name: minio-hot }
  ports: [{ name: s3, port: 9000, targetPort: s3 }, { name: console, port: 9001, targetPort: console }]
---
