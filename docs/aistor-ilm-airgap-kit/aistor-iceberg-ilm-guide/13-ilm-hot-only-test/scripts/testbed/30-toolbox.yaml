# 운영용 toolbox — mc(공유 볼륨) + python3. 버킷/tier/ILM 설정, state 수동 실행, judge 실행에 쓴다.
# MC_HOST_HOT / MC_HOST_WARM(관리자) 는 Secret ilmtest-admin 에서 받는다.
# ⚠️ 여기서 WARM 을 건드리면 Warm audit 에 관리자 accessKey 가 남는다(J-7 판정 시 setup 시각은 제외).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilmtest-toolbox
  labels: { app.kubernetes.io/part-of: ilmtest, app.kubernetes.io/name: toolbox }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: toolbox } }
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: ilmtest, app.kubernetes.io/name: toolbox }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: toolbox
          image: python:3.12-slim
          command: ["sleep", "infinity"]
          env:
            - { name: PATH, value: "/shared/bin:/usr/local/bin:/usr/bin:/bin" }
            - { name: HOME, value: /tmp }
            - { name: MC_CONFIG_DIR, value: /tmp/.mc }
          envFrom: [{ secretRef: { name: ilmtest-admin } }, { configMapRef: { name: ilmtest-config, optional: true } }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 1Gi } }   # mc 대량 목록·업로드 여유
          volumeMounts: [{ name: shared, mountPath: /shared }]
      volumes: [{ name: shared, persistentVolumeClaim: { claimName: ilmtest-shared } }]
