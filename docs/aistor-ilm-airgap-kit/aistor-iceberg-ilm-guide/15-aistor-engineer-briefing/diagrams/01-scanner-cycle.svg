<text x="44" y="736.3333333333334" font-size="13" fill="#232F3E" text-anchor="start" font-weight="normal">speed 를 올리면 ①~⑤ 가 모두 빨라진다 → ILM 만 빠르게 할 수 없다 (질의 Q-S1) · fastest 는 할 일이 없어도 Hot CPU 14m → 82m (실측)</text>
<text x="44" y="752.3333333333334" font-size="13" fill="#232F3E" text-anchor="start" font-weight="normal">규칙의 만기가 지나도 Scanner 가 그 폴더에 오기 전까지는 아무 일도 없다 → ILM 반응 시간 = Days + 00:00 올림 + 사이클 길이</text>
<text x="44" y="38.333333333333336" font-size="22" fill="#000000" text-anchor="start" font-weight="bold">Scanner — 모든 버킷 · 폴더 · 객체 · 버전을 쉬지 않고 한 바퀴씩</text>
<text x="44" y="62.0" font-size="12" fill="#5E6C84" text-anchor="start" font-weight="normal">ILM 규칙은 판단 기준일 뿐 · 실행은 Scanner 가 그 객체를 방문할 때 · 한 번의 방문에서 ILM 외 일도 같이 한다</text>
