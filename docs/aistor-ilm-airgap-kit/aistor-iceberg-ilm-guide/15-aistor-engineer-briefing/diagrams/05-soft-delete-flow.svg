<text x="44" y="744.5" font-size="12" fill="#232F3E" text-anchor="start" font-weight="normal">이어서 (Versioning ON): 비현행 1d → 00:00 올림 → Warm 공간 회수 · 고아 delete marker 정리 (실측 E-5 10-28 00:00 UTC)</text>
