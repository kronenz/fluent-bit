<text x="44" y="559.3333333333334" font-size="13" fill="#232F3E" text-anchor="start" font-weight="normal">Scanner 만으로 1d 를 처리하면 하루치가 09:00 KST 에 만기 → 업무 피크와 겹침. 태그 기반 전이를 02~04 시에 돌리면 만기 쏠림이 사라진다.</text>
<text x="44" y="38.333333333333336" font-size="22" fill="#000000" text-anchor="start" font-weight="bold">하루 운영 시간표 (예) — Scanner 속도 · tiering 작업 · 자정 만기</text>
